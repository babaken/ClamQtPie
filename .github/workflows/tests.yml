name: tests

# 公開リポジトリ: master への push と PR で実行する
# 非公開リポジトリ（開発用）: dev への PR と手動実行だけで実行する（非公開の無料枠を節約するため、push では動かさない）
on:
  push:
    branches: [master]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    if: github.event_name != 'push' || github.repository == 'babaken/ClamQtPie'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # PR のコミット一覧を読むため（gitleaks-action）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    if: github.event_name != 'push' || github.repository == 'babaken/ClamQtPie'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clamav_frontend
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Qt の実行に必要なライブラリ（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: 依存ライブラリ
        run: python -m pip install -r requirements.txt
      - name: テスト
        run: python -m pytest -q
